name: Publish verified developer preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact application version (x.y.z)'
        required: true
        default: '0.5.1'
        type: string
      ref:
        description: 'Exact commit SHA or branch to release; resolved once before both builds'
        required: true
        default: 'main'
        type: string
      title:
        description: 'GitHub Release title'
        required: true
        default: 'Captivela Office v0.5.1 — unsigned developer preview'
        type: string
      confirm:
        description: 'Type PUBLISH to build both platforms and publish the prerelease'
        required: true
        type: string

concurrency:
  group: captivela-office-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      artifact_key: ${{ steps.source.outputs.artifact_key }}
    steps:
      - name: Require explicit publication confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'PUBLISH'
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve and verify immutable release source
        id: source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(node -p "require('./apps/shell/package.json').version")
          test "$version" = "$EXPECTED_VERSION"
          test -n "$(git log -1 --format=%H "$commit")"
          tag="v$version"
          artifact_key="v${version}-${commit:0:12}"
          printf 'commit=%s\ntag=%s\nartifact_key=%s\n' "$commit" "$tag" "$artifact_key" | tee -a "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/windows-build.yml
    with:
      signed: false
      ref: ${{ needs.resolve.outputs.commit }}
      expected_commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ inputs.version }}
      artifact_key: ${{ needs.resolve.outputs.artifact_key }}

  macos:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    with:
      signed: false
      ref: ${{ needs.resolve.outputs.commit }}
      expected_commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ inputs.version }}
      artifact_key: ${{ needs.resolve.outputs.artifact_key }}

  linux:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      expected_commit: ${{ needs.resolve.outputs.commit }}
      version: ${{ inputs.version }}
      artifact_key: ${{ needs.resolve.outputs.artifact_key }}

  publish:
    needs: [resolve, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      ARTIFACT_KEY: ${{ needs.resolve.outputs.artifact_key }}
      RELEASE_TITLE: ${{ inputs.title }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download verified Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: captivela-office-windows-x64-${{ env.ARTIFACT_KEY }}
          path: incoming/windows

      - name: Download verified macOS assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: captivela-office-macos-arm64-${{ env.ARTIFACT_KEY }}
          path: incoming/macos

      - name: Download verified Linux AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: captivela-office-linux-x64-${{ env.ARTIFACT_KEY }}
          path: incoming/linux

      - name: Assemble and reverify final release payload
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(node -p "require('./apps/shell/package.json').version")" = "$VERSION"
          mkdir release-assets
          cp "incoming/windows/Captivela Office Setup ${VERSION}.exe" "release-assets/Captivela.Office.Setup.${VERSION}.exe"
          cp "incoming/windows/Captivela Office Setup ${VERSION}.exe.blockmap" "release-assets/Captivela.Office.Setup.${VERSION}.exe.blockmap"
          cp "incoming/macos/Captivela Office-${VERSION}-arm64.dmg" "release-assets/Captivela.Office-${VERSION}-arm64.dmg"
          cp "incoming/macos/Captivela Office-${VERSION}-arm64.dmg.blockmap" "release-assets/Captivela.Office-${VERSION}-arm64.dmg.blockmap"
          cp "incoming/macos/Captivela Office-${VERSION}-arm64.zip" "release-assets/Captivela.Office-${VERSION}-arm64.zip"
          cp "incoming/linux/Captivela-Office-${VERSION}-x64.AppImage" "release-assets/Captivela-Office-${VERSION}-x64.AppImage"
          node tools/verify-release-assets.mjs --dir release-assets --version "$VERSION" --public-names --write-manifest
          mv release-assets/SHA256SUMS release-assets/SHA256SUMS.txt
          {
            printf '%s\n\n' '# Captivela Office developer preview'
            printf 'Source commit: %s\n\n' "$RELEASE_COMMIT"
            printf '%s\n' 'This prerelease is unsigned and intended for developers and technical evaluators.'
            printf '%s\n\n' 'Windows SmartScreen and macOS Gatekeeper may warn. Verify SHA256SUMS.txt before installing.'
            printf '%s\n' 'See INSTALLATION.md in the tagged source for narrowly scoped installation guidance.'
          } > release-notes.md

      - name: Create fail-closed draft prerelease
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -n "$release_id" ]; then
            state=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')
            test "$state" = 'true' || { echo "Refusing to replace non-draft release $TAG" >&2; exit 1; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease --draft
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease --draft
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          fi
          test -n "$release_id"
          printf '%s' "$release_id" > "$RUNNER_TEMP/captivela-release-id"
          draft_target=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.target_commitish')
          test "$draft_target" = "$RELEASE_COMMIT"

      - name: Upload and verify draft assets
        run: |
          set -euo pipefail
          release_id=$(cat "$RUNNER_TEMP/captivela-release-id")
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync, readdirSync, statSync } from "node:fs";
            for (const name of readdirSync("release-assets").sort()) {
              const path = "release-assets/" + name;
              const data = readFileSync(path);
              console.log(name + "\t" + statSync(path).size + "\tsha256:" + createHash("sha256").update(data).digest("hex"));
            }
          ' > expected-assets.tsv
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[] | [.name, .size, .digest] | @tsv' | sort > actual-assets.tsv
          diff -u expected-assets.tsv actual-assets.tsv

      - name: Publish prerelease only after all verification passes
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$tag_commit" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '{tag_name,draft,prerelease,target_commitish,assets:[.assets[]|{name,size}]}'
