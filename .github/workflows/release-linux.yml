name: Release Linux

# Manual Linux AppImage QA. Public prereleases are assembled only by release.yml,
# which builds Windows, macOS, and Linux from one immutable commit and publishes
# one checksum manifest.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact commit SHA or branch to package'
        required: true
        default: 'main'
        type: string
      version:
        description: 'Expected application version; blank reads apps/shell/package.json'
        required: false
        default: ''
        type: string

jobs:
  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ inputs.ref }}
      expected_commit: ''
      version: ${{ inputs.version }}
      artifact_key: manual-${{ github.run_id }}
